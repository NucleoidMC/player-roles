plugins {
  id 'net.fabricmc.fabric-loom' version '1.15.+' apply false
  id "maven-publish"
}

allprojects {
  apply plugin: "net.fabricmc.fabric-loom"
  apply plugin: "maven-publish"

  version = project.mod_version
  group = project.maven_group

  java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
  }

  tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
  }

  dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
  }

  processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
      expand "version": project.version
    }
  }

  jar {
    from("LICENSE") {
      rename { "${it}_${project.base.archivesName.get()}" }
    }
  }

  afterEvaluate {
    publishing {
      publications {
        mavenJava(MavenPublication) {
          artifactId = project.base.archivesName.get()
          from components.java
        }
      }

      repositories {
        def env = System.getenv()
        if (env.MAVEN_URL) {
          maven {
            credentials {
              username env.MAVEN_USERNAME
              password env.MAVEN_PASSWORD
            }
            url env.MAVEN_URL
          }
        } else {
          mavenLocal()
        }
      }
    }
  }
}

base {
  archivesName = project.archives_base_name
}

repositories {
  mavenCentral()
  maven {
    url "https://maven.nucleoid.xyz/releases"
    content {
      includeGroup 'xyz.nucleoid'
      includeGroup 'me.lucko'
    }
  }
}

dependencies {
  implementation project(path: ":api")
  include project(path: ":api")

  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
  compileOnly "me.lucko:fabric-permissions-api:0.7.0"

  implementation include("xyz.nucleoid:more-codecs:0.3.5+26.1")

  testImplementation platform("org.junit:junit-bom:5.7.0")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"

  testImplementation "com.google.jimfs:jimfs:1.3.0"
}

test {
  useJUnitPlatform()
  testLogging {
    events "passed", "skipped", "failed"
  }
}
